services:
  queue:
    extends:
      file: docker-compose.compat.yml
      service: php
    environment:
      MAIL_SYNC_SEND: ${MAIL_SYNC_SEND:-false}
      TELEGRAM_SYNC_SEND: ${TELEGRAM_SYNC_SEND:-false}
      CORE_JOB_SYNC_EXECUTION: ${CORE_JOB_SYNC_EXECUTION:-false}
      PHP_HTTP_API_COMPAT: ${PHP_HTTP_API_COMPAT:-false}
      PHP_SERVER_INGRESS_COMPAT: ${PHP_SERVER_INGRESS_COMPAT:-false}
      PHP_WEB_COMPAT: ${PHP_WEB_COMPAT:-false}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    command: ["php", "artisan", "horizon"]
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
    expose: []
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
