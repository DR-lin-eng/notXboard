<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
    <title>{{ $title }}</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            --canvas: #f3f6f5;
            --surface: #ffffff;
            --text: #172026;
            --muted: #5e6b73;
            --line: #dce4e1;
            --primary: #0f766e;
            --primary-strong: #0b5f59;
        }

        * {
            box-sizing: border-box;
            letter-spacing: 0;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            grid-template-rows: auto 1fr auto;
            color: var(--text);
            background: var(--canvas);
            -webkit-font-smoothing: antialiased;
        }

        header,
        main,
        footer {
            width: min(100% - 40px, 960px);
            margin-inline: auto;
        }

        header {
            min-height: 68px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--line);
            font-size: 14px;
            font-weight: 750;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: inherit;
            text-decoration: none;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 7px;
            color: #ffffff;
            background: var(--primary);
            font-size: 11px;
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-block: 56px;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--primary);
            font-size: 13px;
            font-weight: 750;
        }

        h1 {
            max-width: 720px;
            margin: 0;
            font-size: 56px;
            line-height: 1.08;
            overflow-wrap: anywhere;
        }

        .summary {
            max-width: 520px;
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.7;
        }

        .button {
            min-height: 44px;
            margin-top: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border: 1px solid var(--primary);
            border-radius: 7px;
            color: #ffffff;
            background: var(--primary);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 160ms ease, border-color 160ms ease;
        }

        .button:hover {
            border-color: var(--primary-strong);
            background: var(--primary-strong);
        }

        .button:focus-visible {
            outline: 3px solid rgba(14, 116, 144, 0.3);
            outline-offset: 3px;
        }

        footer {
            min-height: 64px;
            display: flex;
            align-items: center;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 480px) {
            header,
            main,
            footer {
                width: min(100% - 28px, 960px);
            }

            main {
                padding-block: 40px;
            }

            h1 {
                font-size: 36px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 1ms !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="/" aria-label="{{ $title }} 首页">
            <span class="brand-mark" aria-hidden="true">W</span>
            <span>{{ $title }}</span>
        </a>
    </header>
    <main>
        <p class="eyebrow">授权访问</p>
        <h1>{{ $title }}</h1>
        <p class="summary">此站点仅供获授权的成员使用。</p>
        <a class="button" href="/app/#/login" rel="nofollow">继续</a>
    </main>
    <footer>Private workspace</footer>
</body>
</html>
