<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Linux DO Connect 登录 · notXboard</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            --canvas: #f3f6f5;
            --surface: #ffffff;
            --text: #172026;
            --muted: #5e6b73;
            --line: #dce4e1;
            --primary: #0f766e;
            --primary-strong: #0b5f59;
        }

        * {
            box-sizing: border-box;
            letter-spacing: 0;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text);
            background: var(--canvas);
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: min(440px, 100%);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            font-size: 14px;
            font-weight: 750;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 7px;
            color: #ffffff;
            background: var(--primary);
            font-size: 11px;
        }

        .card {
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: 0 10px 30px rgba(23, 32, 38, 0.08);
        }

        h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.3;
        }

        p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.65;
        }

        .actions {
            margin-top: 22px;
            display: grid;
            gap: 10px;
        }

        .button {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border: 1px solid var(--primary);
            border-radius: 7px;
            color: #ffffff;
            background: var(--primary);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 160ms ease, border-color 160ms ease;
        }

        .button:hover {
            border-color: var(--primary-strong);
            background: var(--primary-strong);
        }

        .button:focus-visible {
            outline: 3px solid rgba(14, 116, 144, 0.3);
            outline-offset: 3px;
        }

        .button svg {
            width: 16px;
            height: 16px;
        }

        .privacy {
            font-size: 12px;
        }

        @media (max-width: 480px) {
            body {
                align-items: start;
                padding: 20px 14px;
            }

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 1ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">NX</span>
            <span>notXboard</span>
        </div>
        <section class="card" aria-labelledby="page-title">
            <h1 id="page-title">使用 Linux DO Connect 登录</h1>
            <p>继续后将前往 Linux DO 完成身份验证，并返回当前站点。</p>
            <div class="actions">
                <a class="button" href="/api/v1/passport/oauth2/linux-do/redirect">
                    <span>继续登录</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"></path>
                        <path d="m13 6 6 6-6 6"></path>
                    </svg>
                </a>
            </div>
            <p class="privacy">仅使用授权结果建立登录会话。</p>
        </section>
    </main>
</body>
</html>
