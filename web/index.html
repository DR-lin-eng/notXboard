<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="app-name" content="__APP_NAME__">
  <meta name="app-version" content="__APP_VERSION__">
  <meta name="app-url" content="__APP_URL__">
  <meta name="app-page" content="__APP_PAGE__">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 22V10l7 12V10m7 0-7 12' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>__APP_NAME__</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nx_theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>

  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>

</html>
