name: Build and Publish

on:
  push:
    branches: [master, new-dev]
    tags: ["v*"]
    paths:
      - ".github/workflows/docker-publish.yml"
      - "Dockerfile"
      - "rust-gateway/**"
      - "tools/package_rust_gateway_release.sh"
      - "tools/run-notxboard-gateway.sh"
  pull_request:
    paths:
      - ".github/workflows/docker-publish.yml"
      - "Dockerfile"
      - "rust-gateway/**"
      - "tools/package_rust_gateway_release.sh"
      - "tools/run-notxboard-gateway.sh"
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "1"
  REGISTRY: ghcr.io

jobs:
  linux-binary:
    name: Linux AMD64 bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-gateway -> target

      - name: Build release binary
        run: cargo build --release --locked -j 1 --manifest-path rust-gateway/Cargo.toml

      - name: Package standalone bundle
        env:
          VERSION: ${{ github.ref_name }}-${{ github.sha }}
          ARCH: amd64
        run: bash tools/package_rust_gateway_release.sh

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: notxboard-linux-amd64-${{ github.run_number }}
          path: |
            dist/notxboard-*-linux-amd64.tar.gz
            dist/notxboard-*-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker AMD64 and ARM64
    needs: linux-binary
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=notxboard-docker
          cache-to: type=gha,mode=max,scope=notxboard-docker
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: github.event_name != 'pull_request' && steps.build.outputs.digest != ''
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest
        if: github.event_name != 'pull_request' && steps.build.outputs.digest != ''
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Deployment summary
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Deployment image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Deploy with Docker Compose" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "GATEWAY_IMAGE=${IMAGE}@${DIGEST} docker compose -f deploy/compose.ghcr.yml up -d mysql redis gateway" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
